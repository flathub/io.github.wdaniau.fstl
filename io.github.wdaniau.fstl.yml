id: io.github.wdaniau.fstl
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: fstl-e
rename-desktop-file: fstlapp-fstl-e.desktop
rename-icon: fstlapp-fstl-e
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-run/gvfs # make GnomeVFS accessible
  - --filesystem=/run/media
  - --filesystem=/media
  - --env=QT_QPA_PLATFORM=xcb
modules:
  - name: fstl-e
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DQT_DESIRED_VERSION=6
    sources:
      - type: git
        url: https://github.com/wdaniau/fstl
        commit: 33d736e7aff802beba87fd26819e17bd306528fc
