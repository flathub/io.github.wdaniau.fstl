id: io.github.wdaniau.fstl
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: fstl-e
rename-desktop-file: fstlapp-fstl-e.desktop
rename-icon: fstlapp-fstl-e
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-run/gvfs # make GnomeVFS accessible
  - --filesystem=/run/media
  - --filesystem=/media
modules:
  - name: fstl-e
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/wdaniau/fstl
        commit: 23cdbafbe8d98b91ea88fa739f538cb9f13f7aa7
